name: Publish Docker image

# Publishes the single Quizzy image (Next.js + Socket.io) to Docker Hub.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  — your Docker Hub account name
#   DOCKERHUB_TOKEN     — a Docker Hub access token (Account Settings → Security)
#
# Optional repository variable:
#   DOCKERHUB_REPO      — image name, defaults to "quizzy"

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to publish (e.g. v1.0.0)'
        required: false

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & push to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # QEMU is what makes the linux/arm64 leg possible on an amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO || 'quizzy' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=Quizzy
            org.opencontainers.image.description=Real-time team quiz battles (Next.js + Socket.io)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_SOCKET_URL is deliberately left unset: the published
          # image must stay portable. The client derives the socket URL from the
          # page's own hostname (see src/lib/socket.ts).

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Run it:"
            echo '```bash'
            echo "docker run -p 3000:3000 -p 3001:3001 ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO || 'quizzy' }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
